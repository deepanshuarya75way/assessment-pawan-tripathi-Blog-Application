spring.application.name=blog-application

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/blogapp

# Server
server.port=8080

# JWT (override in production via env vars)
app.jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyPleaseChangeItInProduction123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
